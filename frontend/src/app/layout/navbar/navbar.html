<aside
  class="h-screen w-20 md:w-56 bg-neutral-950 border-r border-neutral-800/60 flex flex-col justify-between py-6 px-3">
  <div>
    <div class="flex items-center gap-2 px-2 mb-10">
      <div class="h-8 w-8 rounded-md bg-emerald-500/90"></div>
      <span class="hidden md:block text-neutral-100 font-semibold tracking-tight">Sonder</span>
    </div>

    <nav class="flex flex-col gap-1">
      <a routerLink="/" routerLinkActive="bg-neutral-800/80 text-white" [routerLinkActiveOptions]="{ exact: true }"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-800/50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
        <span class="hidden md:block text-sm font-medium">Home</span>
      </a>

      <a routerLink="/playlist" routerLinkActive="bg-neutral-800/80 text-white"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-800/50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
        <span class="hidden md:block text-sm font-medium">Playlist</span>
      </a>

      <a routerLink="/discover" routerLinkActive="bg-neutral-800/80 text-white"
        class="group flex items-center gap-3 px-3 py-2.5 rounded-lg text-neutral-400 hover:text-white hover:bg-neutral-800/50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z" />
        </svg>
        <span class="hidden md:block text-sm font-medium">Discover</span>
      </a>
    </nav>
  </div>

  <div class="flex items-center gap-3 px-2">
    <div class="h-9 w-9 rounded-full bg-neutral-700 shrink-0"></div>
    <div class="hidden md:block leading-tight">
      <p class="text-sm text-neutral-200 font-medium">User</p>
      <p class="text-xs text-neutral-500">No Session</p>
    </div>
  </div>
</aside>

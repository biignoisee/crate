<aside class="h-screen w-20 md:w-60 bg-[#0a0e1a] border-r border-white/[0.06] flex flex-col justify-between py-6 px-3">
  <div>
    <div class="flex items-center gap-2.5 px-2 mb-10">
      <div class="h-7 w-7 rounded-md bg-[#3b6fd4]"></div>
      <span class="hidden md:block text-white font-semibold tracking-tight text-[15px]">Crate</span>
    </div>

    <nav class="flex flex-col gap-0.5">
      <a routerLink="/" routerLinkActive="bg-white/[0.06] text-white" [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#8b93a7] hover:text-white hover:bg-white/[0.04] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5" />
          <path d="M5 9.5V21h14V9.5" />
        </svg>
        <span class="hidden md:block text-sm">Home</span>
      </a>

      <a routerLink="/playlist" routerLinkActive="bg-white/[0.06] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#8b93a7] hover:text-white hover:bg-white/[0.04] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
        <span class="hidden md:block text-sm">Playlist</span>
      </a>

      <a routerLink="/discover" routerLinkActive="bg-white/[0.06] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#8b93a7] hover:text-white hover:bg-white/[0.04] transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="m16.2 7.8-2 6.4-6.4 2 2-6.4z" />
        </svg>
        <span class="hidden md:block text-sm">Discover</span>
      </a>
    </nav>
  </div>

  <div class="flex items-center gap-3 px-2">
    <div class="h-8 w-8 rounded-full bg-white/[0.08] shrink-0"></div>
    <div class="hidden md:block leading-tight">
      <p class="text-sm text-white font-medium">User</p>
      <p class="text-xs text-[#5c6478]">No session</p>
    </div>
  </div>
</aside>

<div class="flex min-h-0 flex-1 flex-col overflow-y-auto p-4" role="log" aria-live="polite" aria-relevant="additions">
  @if (messages().length === 0) {
    <div class="flex flex-1 items-center justify-center">
      <base-empty-state [title]="emptyTitle()" [description]="emptyDescription()" iconName="sparkles"></base-empty-state>
    </div>
  } @else {
    <div class="flex flex-col gap-4">
      @for (message of messages(); track message.id) {
        <base-chat-message [message]="message"></base-chat-message>
      }
    </div>
  }
</div>
<div class="border-t border-slate-200 p-3 dark:border-slate-700">
  <base-chat-prompt
    [placeholder]="placeholder()"
    [streaming]="streaming()"
    [disabled]="disabled()"
    (send)="send.emit($event)"
    (stop)="stop.emit()"></base-chat-prompt>
  <p class="mb-0! mt-2 text-center text-[11px] text-slate-400">Enter to send · Shift+Enter for a new line</p>
</div>

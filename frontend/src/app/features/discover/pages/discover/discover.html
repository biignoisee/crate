<div class="flex flex-col h-full bg-[#0d1220] text-[#e4e7ee]">
  <header class="px-8 py-6 border-b border-white/[0.06]">
    <h1 class="text-lg font-semibold text-white">Discover</h1>
    <p class="text-sm text-[#5c6478]">Ask about artists, moods, or what to play next</p>
  </header>

  <div class="flex-1 min-h-0 px-8 py-6">
    <base-chat class="h-full" [messages]="messages()" [streaming]="streaming()"
      placeholder="What have you been listening to recently?" emptyTitle="What have you been listening to recently?"
      emptyDescription="Tell me a track, artist, or mood and I'll take it from there." (send)="onSend($event)"
      (stop)="stop()" />
  </div>
</div>

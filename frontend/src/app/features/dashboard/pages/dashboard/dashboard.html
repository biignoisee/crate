<div class="bg-[#0d1220] text-[#e4e7ee] p-8 min-h-full">
  <header class="mb-8">
    <p class="text-[#5c6478] text-sm">Welcome back</p>
    <h1 class="text-2xl font-semibold tracking-tight text-white">Your listening overview</h1>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
    <div class="bg-[#12182b] border border-white/[0.06] rounded-xl p-5">
      <p class="text-[#5c6478] text-xs uppercase tracking-wide mb-1">Hours listened</p>
      <p class="text-3xl font-semibold text-white">42.5h</p>
    </div>
    <div class="bg-[#12182b] border border-white/[0.06] rounded-xl p-5">
      <p class="text-[#5c6478] text-xs uppercase tracking-wide mb-1">New artists</p>
      <p class="text-3xl font-semibold text-white">18</p>
    </div>
    <div class="bg-[#12182b] border border-white/[0.06] rounded-xl p-5">
      <p class="text-[#5c6478] text-xs uppercase tracking-wide mb-1">Top genre</p>
      <p class="text-3xl font-semibold text-white">Indie</p>
    </div>
  </div>

  <div class="bg-[#12182b] border border-white/[0.06] rounded-xl p-6 mb-8">
    <p class="text-sm text-[#8b93a7] mb-4">Listening activity (last 10 days)</p>
    <svg viewBox="0 0 300 100" class="w-full h-40" preserveAspectRatio="none">
      <path [attr.d]="path" fill="none" stroke="#3b6fd4" stroke-width="2" />
    </svg>
  </div>

  <div class="bg-[#12182b] border border-white/[0.06] rounded-xl p-6">
    <p class="text-sm text-[#8b93a7] mb-4">Based on what you listened to last</p>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      @for (i of [1,2,3,4]; track i) {
      <div class="group cursor-pointer">
        <div class="aspect-square rounded-lg bg-white/[0.04] mb-2 group-hover:bg-white/[0.07] transition-colors"></div>
        <p class="text-sm text-[#e4e7ee] truncate">Artist {{ i }}</p>
        <p class="text-xs text-[#5c6478]">Recommended</p>
      </div>
      }
    </div>
  </div>
</div>

<div class="bg-neutral-900 text-neutral-100 p-8">
  <header class="mb-8">
    <p class="text-neutral-500 text-sm">Bienvenido de vuelta</p>
    <h1 class="text-2xl font-semibold tracking-tight">Tu resumen musical</h1>
  </header>

  <!-- Stat cards -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
    <div class="bg-neutral-800/60 border border-neutral-800 rounded-xl p-5">
      <p class="text-neutral-500 text-xs uppercase tracking-wide mb-1">Horas escuchadas</p>
      <p class="text-3xl font-semibold">42.5h</p>
    </div>
    <div class="bg-neutral-800/60 border border-neutral-800 rounded-xl p-5">
      <p class="text-neutral-500 text-xs uppercase tracking-wide mb-1">Artistas nuevos</p>
      <p class="text-3xl font-semibold">18</p>
    </div>
    <div class="bg-neutral-800/60 border border-neutral-800 rounded-xl p-5">
      <p class="text-neutral-500 text-xs uppercase tracking-wide mb-1">Género top</p>
      <p class="text-3xl font-semibold">Indie</p>
    </div>
  </div>

  <!-- Chart -->
  <div class="bg-neutral-800/60 border border-neutral-800 rounded-xl p-6 mb-8">
    <p class="text-sm text-neutral-400 mb-4">Actividad de escucha (últimos 10 días)</p>
    <svg viewBox="0 0 300 100" class="w-full h-40" preserveAspectRatio="none">
      <path [attr.d]="path" fill="none" stroke="#10b981" stroke-width="2" />
    </svg>
  </div>

  <!-- Recomendaciones (placeholder para el RAG) -->
  <div class="bg-neutral-800/60 border border-neutral-800 rounded-xl p-6">
    <p class="text-sm text-neutral-400 mb-4">Basado en lo que escuchaste último</p>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      @for (i of [1,2,3,4]; track i) {
      <div class="group cursor-pointer">
        <div class="aspect-square rounded-lg bg-neutral-700/70 mb-2 group-hover:bg-neutral-700 transition-colors"></div>
        <p class="text-sm text-neutral-200 truncate">Artista {{ i }}</p>
        <p class="text-xs text-neutral-500">Recomendado</p>
      </div>
      }
    </div>
  </div>
</div>
